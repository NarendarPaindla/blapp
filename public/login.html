<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - BloodLink</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body style="display:flex; align-items:center; justify-content:center;">

    <div class="glass-card form-wrapper" style="width: 100%; max-width:400px;">
        <h2 style="text-align:center; margin-bottom:1.5rem;">Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p style="margin-top:1rem; text-align:center;">
            New here? <a href="register.html" style="color:var(--primary-red)">Create Account</a>
        </p>
        <div id="message" class="message-box"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // Save Token
                    localStorage.setItem('userInfo', JSON.stringify(data));
                    if (data.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                } else {
                    document.getElementById('message').innerText = data.message;
                    document.getElementById('message').style.color = 'red';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>

</html>
