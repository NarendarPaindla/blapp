<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Account - BloodLink</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <div class="glass-card form-wrapper">
            <h2 style="text-align:center;">Join the Community</h2>
            <p style="text-align:center; margin-bottom:2rem; color:#666;">Create a single account to donate or request
                blood.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Location (City)</label>
                        <input type="text" id="location" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <div id="message" class="message-box"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                location: document.getElementById('location').value
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (res.ok) {
                    localStorage.setItem('userInfo', JSON.stringify(result));
                    window.location.href = 'user-dashboard.html';
                } else {
                    document.getElementById('message').innerText = result.message;
                    document.getElementById('message').style.color = 'red';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>

</html>
